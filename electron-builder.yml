appId: io.codelv8.codexquota
productName: Codex Quota
artifactName: Codex-Quota-${version}-${arch}.${ext}
icon: assets/codex-quota.ico
asar: true
directories:
  output: release
files:
  - dist-renderer/**/*
  - electron/**/*
  - assets/**/*
  - "!assets/codex-router.png"
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Codex Quota
  runAfterFinish: false
publish:
  provider: github
  owner: dekwatdesign
  repo: CodeLV8-Codex-Quota
  releaseType: release
